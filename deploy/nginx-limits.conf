# Request limits for the Procom Solutions vhost (audit 2026-10-08). Installed by deploy-app.sh as
# /etc/nginx/conf.d/procom-limits.conf (conf.d is loaded inside the http block, which is where
# limit_req_zone belongs). The vhost applies it to /api/: 20 requests a second per visitor address,
# with room for bursts of 60 (a checkout page makes several calls at once), then 429.
limit_req_zone $binary_remote_addr zone=procom_api:10m rate=20r/s;
limit_req_status 429;
