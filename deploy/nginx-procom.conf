# nginx vhost for Procom Solutions -- sits alongside lapanza.conf on the same VPS.
# Static site from dist/, API + admin proxied to the Node service on 127.0.0.1:8788
# (Lapanza's service uses 8787). Installed to /etc/nginx/conf.d/procom.conf.
#
# After DNS points here, enable HTTPS with:
#   sudo certbot --nginx -d procompretoria.co.za -d www.procompretoria.co.za

server {
    listen 80;
    listen [::]:80;
    server_name procompretoria.co.za www.procompretoria.co.za;

    root /opt/procom/app/dist;
    index index.html;

    # Covers supplier .xlsx pricelists with embedded photos (server limit: 60MB).
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # large pricelist imports
    }

    location /admin {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
    }

    # Product photos: served straight from disk. Filenames are random UUIDs
    # that never change content, so they can be cached hard.
    location /uploads/ {
        alias /opt/procom/app/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
