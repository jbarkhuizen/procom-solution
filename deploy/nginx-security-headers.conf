# Security headers for the Procom Solutions vhost (audit 2026-10-08).
# Installed by deploy-app.sh as /etc/nginx/procom-security-headers.conf and included by the
# HTTPS server block and by every location that sets its own add_header (nginx does not
# inherit add_header into a location that has one of its own).
# HSTS: browsers refuse plain http for a year after one https visit. No includeSubDomains:
# only www and the bare domain are ours to promise.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
