# nginx vhost for Procom Solutions (procomsolutions.co.za) on the shared VPS.
# Static storefront from dist/; API, admin and sitemap proxied to the Node
# service on 127.0.0.1:8788 (Lapanza uses 8787, Barkie 4100/4200).
# Live copy: /etc/nginx/conf.d/procomsolutions.conf
#
# The Let's Encrypt certificate already exists for this domain (certbot
# auto-renews it). On a brand-new server, install only the port-80 block
# first and run:  sudo certbot --nginx -d procomsolutions.co.za -d www.procomsolutions.co.za

server {
    server_name procomsolutions.co.za www.procomsolutions.co.za;

    root /opt/procomsolutions/app/dist;
    index index.html;

    # Covers supplier .xlsx pricelists with embedded photos (server limit: 60MB).
    client_max_body_size 64m;

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s; # large pricelist imports
    }

    location /admin {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Product photos straight from disk; UUID filenames never change content.
    location /uploads/ {
        alias /opt/procomsolutions/app/data/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/procomsolutions.co.za/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/procomsolutions.co.za/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name procomsolutions.co.za www.procomsolutions.co.za;
    return 301 https://$host$request_uri;
}
