<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Procom Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#f7f3eb" />
  <link rel="icon" type="image/svg+xml" href="/branding/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Fraunces:opsz,wght@9..144,500..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
  <script>
  (function(){try{var t=localStorage.getItem('procom-admin-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
  </script>
</head>
<body>
  <div id="app">
    <section id="view-login" class="login-screen hidden">
      <div class="login-card">
        <p class="eyebrow">Procom Solutions</p>
        <h1 id="login-heading">Admin portal</h1>
        <p class="muted" id="login-intro">Manage products, warehouse pricelists, categories and orders.</p>
        <form id="login-form" class="stack gap-3">
          <label class="field"><span>Username or email</span><input name="username" required autocomplete="username" /></label>
          <label class="field hidden" id="setup-email"><span>Email (optional)</span><input name="email" type="email" autocomplete="email" /></label>
          <label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password" minlength="10" /></label>
          <button type="submit" class="btn btn-primary" id="login-submit">Sign in</button>
          <p id="login-error" class="error hidden"></p>
        </form>
      </div>
    </section>

    <div id="shell" class="shell hidden">
      <aside class="sidebar">
        <div class="sidebar-brand">
          <span class="brand-mark" style="display:inline-flex;align-items:center;gap:8px"><img src="/branding/logo-mark.svg" alt="" style="height:30px;width:30px" />Procom <em>Admin</em></span>
          <button id="theme-toggle" class="theme-toggle" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
            <span class="theme-icon sun" aria-hidden="true">☀</span><span class="theme-icon moon" aria-hidden="true">☾</span>
          </button>
        </div>
        <nav class="sidebar-nav">
          <p class="nav-group-label">Sales</p>
          <button class="nav-btn" data-route="dashboard">Dashboard</button>
          <button class="nav-btn" data-route="orders">Orders</button>
          <button class="nav-btn" data-route="messages">Enquiries</button>
          <hr class="nav-divider" />
          <p class="nav-group-label">Catalogue</p>
          <button class="nav-btn" data-route="products">Products</button>
          <button class="nav-btn" data-route="categories">Categories</button>
          <button class="nav-btn" data-route="feed">Warehouse feed</button>
          <button class="nav-btn" data-route="suppliers">Suppliers</button>
          <hr class="nav-divider" />
          <p class="nav-group-label">Settings</p>
          <button class="nav-btn" data-route="shipping">Shipping options</button>
          <button class="nav-btn" data-route="settings">Site settings</button>
          <button class="nav-btn" data-route="admins">Admin users</button>
          <button class="nav-btn" data-route="backups">Backups</button>
        </nav>
        <div class="sidebar-foot">
          <a class="btn btn-ghost full" href="/" target="_blank" rel="noopener" style="text-align:center;text-decoration:none;color:inherit">View site ↗</a>
          <button id="btn-logout" class="btn btn-ghost full" type="button">Sign out</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow" id="top-eyebrow">Overview</p>
            <h2 id="top-title">Dashboard</h2>
          </div>
          <div class="topbar-actions" id="top-actions"></div>
        </header>
        <div id="view"></div>
      </main>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
  </div>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
